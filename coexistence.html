<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Camp Mantap WhatsApp Coexistence</title>

    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</head>

<body>
    <h2>Camp Mantap WhatsApp Setup</h2>

    <button onclick="launchWhatsAppSignup()">
        Connect Camp Mantap WhatsApp
    </button>

    <pre id="result"></pre>

    <script>
        window.fbAsyncInit = function () {
            FB.init({
                appId: '2130494357850464',
                cookie: true,
                xfbml: true,
                version: 'v25.0'
            });
        };

        function launchWhatsAppSignup() {
            FB.login(function (response) {
                console.log('FB login response:', response);

                if (response.authResponse) {
                    document.getElementById('result').textContent =
                        'Login successful. Waiting for WhatsApp onboarding...';
                } else {
                    document.getElementById('result').textContent =
                        'Login cancelled.';
                }
            }, {
                config_id: '923062280857767',
                response_type: 'code',
                override_default_response_type: true,
                extras: {
                    setup: {},
                    featureType: 'whatsapp_business_app_onboarding',
                    sessionInfoVersion: '3'
                }
            });
        }

        window.addEventListener('message', function (event) {
            if (!event.origin.endsWith('facebook.com')) return;

            try {
                const data = JSON.parse(event.data);

                if (data.type !== 'WA_EMBEDDED_SIGNUP') return;

                console.log('WhatsApp Embedded Signup event:', data);

                document.getElementById('result').textContent =
                    JSON.stringify(data, null, 2);
            } catch (err) {
                // Ignore non-JSON messages
            }
        });
    </script>
</body>

</html>
