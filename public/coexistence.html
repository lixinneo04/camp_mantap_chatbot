<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camp Mantap WhatsApp Coexistence</title>

    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
</head>

<body>
    <h1>Camp Mantap WhatsApp Coexistence</h1>

    <p>Click the button to start WhatsApp Embedded Signup.</p>

    <button id="connectBtn" disabled>
        Loading Facebook SDK...
    </button>

    <pre id="result"></pre>

    <script>
        window.fbAsyncInit = function () {
            FB.init({
                appId: '2130494357850464',
                cookie: true,
                xfbml: true,
                version: 'v23.0'
            });

            document.getElementById('connectBtn').disabled = false;
            document.getElementById('connectBtn').textContent =
                'Connect Camp Mantap WhatsApp';

            console.log('Facebook SDK initialized');
        };

        // Collected from FB.login (code) and the Embedded Signup message event (IDs)
        const signup = { code: null, waba_id: null, phone_number_id: null };
        let submitted = false;

        function show(obj) {
            document.getElementById('result').textContent =
                typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
        }

        async function completeOnboardingIfReady() {
            if (submitted || !signup.code || !signup.waba_id || !signup.phone_number_id) return;
            submitted = true;
            show('Finishing setup on server...');
            try {
                const r = await fetch('/coexistence/complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(signup)
                });
                const data = await r.json();
                show(data.ok
                    ? { status: '✅ Connected! Bot chats will now appear in the WhatsApp Business app.', ...data }
                    : { status: '❌ Setup failed', ...data });
            } catch (err) {
                submitted = false;
                show('❌ Could not reach server: ' + err.message);
            }
        }

        document.getElementById('connectBtn').addEventListener('click', function () {
            show('Opening Meta Embedded Signup...');

            FB.login(function (response) {
                console.log('FB.login response:', response);

                if (response.authResponse && response.authResponse.code) {
                    console.log('Facebook login successful');
                    signup.code = response.authResponse.code;
                    completeOnboardingIfReady();
                } else {
                    console.log('Facebook login cancelled or failed');
                    show(response);
                }
            }, {
                config_id: '923062280857767',
                response_type: 'code',
                override_default_response_type: true,

                extras: {
                    setup: {},
                    featureType: 'whatsapp_business_app_onboarding',
                    sessionInfoVersion: '3'
                }
            });
        });

        window.addEventListener('message', function (event) {
            if (!event.origin.endsWith('facebook.com')) {
                return;
            }

            try {
                const data = JSON.parse(event.data);

                console.log('Embedded Signup event:', data);

                if (data.type === 'WA_EMBEDDED_SIGNUP') {
                    if (String(data.event).startsWith('FINISH')) {
                        signup.waba_id = data.data?.waba_id;
                        signup.phone_number_id = data.data?.phone_number_id;
                        completeOnboardingIfReady();
                    } else if (data.event === 'CANCEL' || data.event === 'ERROR') {
                        show(data);
                    }
                }
            } catch (error) {
                // Ignore messages that are not JSON
            }
        });
    </script>
</body>

</html>
